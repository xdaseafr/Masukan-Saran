<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak Saran Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-slate-100 min-h-screen py-8 px-4 flex items-center justify-center">
    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-blue-100">
        <div class="text-center mb-6">
            <div class="inline-block p-3 bg-blue-100 text-blue-600 rounded-full mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Kotak Saran</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan masukkan tanggal, kritik, atau saran Anda.</p>
        </div>
        
        <!-- Form Input -->
        <form id="saranForm" class="space-y-4">
            <!-- Input Tanggal -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Tanggal</label>
                <input type="date" id="date" required class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-slate-50">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">First Name</label>
                    <input type="text" id="firstname" required placeholder="Nama depan" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-slate-50">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Last Name</label>
                    <input type="text" id="lastname" placeholder="Nama belakang" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-slate-50">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Alamat</label>
                <input type="text" id="alamat" placeholder="Masukkan alamat" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-slate-50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">No HP</label>
                <input type="tel" id="no_hp" placeholder="Contoh: 08123456789" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-slate-50">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Subject / Pesan</label>
                <!-- resize-none membuat kotak tidak bisa ditarik turun/ubah ukuran -->
                <textarea id="subject" rows="3" required placeholder="Tuliskan pesan atau saran Anda di sini..." class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-slate-50 resize-none"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3.5 rounded-xl transition shadow-lg shadow-blue-200">
                Kirim Saran
            </button>
        </form>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbypqxoe2VAvWVM3TaFfWLyWE0ea1YJhezNARjMpYkJuSIs6gr7EYDiYSTvTDxJmZ5XjMQ/exec'; // Ganti dengan URL Web App Apps Script Anda
        const form = document.getElementById('saranForm');
        const submitBtn = document.getElementById('submitBtn');

        // Otomatis isi tanggal hari ini
        document.getElementById('date').valueAsDate = new Date();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.innerText = 'Mengirim...';
            submitBtn.disabled = true;

            const data = {
                date: document.getElementById('date').value,
                firstname: document.getElementById('firstname').value,
                lastname: document.getElementById('lastname').value,
                alamat: document.getElementById('alamat').value,
                no_hp: document.getElementById('no_hp').value,
                subject: document.getElementById('subject').value,
            };

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                alert('Terima kasih! Saran Anda berhasil dikirim.');
                form.reset();
                document.getElementById('date').valueAsDate = new Date();
            } catch (error) {
                console.error('Error:', error);
                alert('Terjadi kesalahan, gagal mengirim data.');
            } finally {
                submitBtn.innerText = 'Kirim Saran';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
